name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # Verified latest release: v7.0.1 (https://github.com/actions/checkout/releases/tag/v7.0.1)
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        # Verified latest release: v7.1.0 (https://github.com/actions/setup-python/releases/tag/v7.1.0)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: pytest
