name: Scheduled Open-Meteo Forecast Archive

'on':
  schedule:
    # 4 times daily at 01:17, 07:17, 13:17, 19:17 UTC (odd minute to avoid top-of-hour contention).
    # Note: Scheduled workflow runs on GitHub Actions can start late depending on queue delays; exact timing is not guaranteed.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-open-meteo
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main repository
        # TODO: Verify actions/checkout version on its official releases page (sandboxed environment has no network)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Record workflow start time
        id: record-start
        run: |
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          echo "START_TIME=$START_TIME" >> $GITHUB_ENV

      - name: Check out archive-data branch into subfolder
        # TODO: Verify actions/checkout version on its official releases page (sandboxed environment has no network)
        uses: actions/checkout@v7
        with:
          ref: archive-data
          path: archive-data

      - name: Initialize archive-data orphan branch if missing
        if: steps.checkout-archive-data.outcome != 'success'
        run: |
          rm -rf archive-data
          mkdir -p archive-data
          cd archive-data
          git init -b archive-data

      - name: Set up Python 3.12
        # Verified latest release: v7.1.0 (https://github.com/actions/setup-python/releases/tag/v7.1.0)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run archive script
        run: |
          python -m ingest.archive_open_meteo --raw-dir archive-data

      - name: Commit and push raw data
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUSH_STATUS="skipped"
          FILES_COMMITTED=0
          if [ -d "archive-data" ]; then
            cd archive-data
            git config --global --add safe.directory "*"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git remote get-url origin > /dev/null 2>&1; then
              git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            else
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            fi
            git add .
            if git diff --staged --quiet; then
              echo "No new files to commit."
              PUSH_STATUS="up-to-date (no new files)"
            else
              FILES_COMMITTED=$(git diff --staged --name-only | wc -l)
              git commit -m "data(archive): save Open-Meteo forecasts [skip ci]"
              if git push -u origin archive-data; then
                PUSH_STATUS="success"
              else
                PUSH_STATUS="failed"
              fi
            fi
          else
            echo "archive-data directory not found, skipping push."
            PUSH_STATUS="failed (archive-data missing)"
          fi
          echo "push_status=$PUSH_STATUS" >> $GITHUB_ENV
          echo "files_committed=$FILES_COMMITTED" >> $GITHUB_ENV

      - name: Report archive-data commit status
        if: always()
        run: |
          if [ -d "archive-data/.git" ]; then
            cd archive-data
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              COUNT=$(git diff-tree --no-commit-id --name-only -r --root HEAD | wc -l)
              echo "Files in latest archive-data commit: $COUNT"
              git log -1 --stat
            else
              echo "No commits found in archive-data branch."
            fi
          else
            echo "archive-data git repository not found."
          fi

      - name: Write GitHub Step Summary
        if: always()
        run: |
          echo "## Open-Meteo Forecast Archive Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Event Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Start Time (UTC)** | \`${{ env.START_TIME || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files Committed** | \`${{ env.files_committed || '0' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Push Succeeded** | \`${{ env.push_status || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
